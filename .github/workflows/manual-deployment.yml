name: 1. Manual Deployment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Wybierz środowisko'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      ecr_hash:
        description: 'Hash obrazu z AWS ECR'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json

      - name: Render new task definition with updated image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: twittex-app
          image: ${{ steps.login-ecr.outputs.registry }}/twittex-app:${{ github.event.inputs.ecr_hash }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Release Summary
        run: |
          echo "Wdrożono na środowisko: ${{ github.event.inputs.target_env }}"
          echo "Obraz ECR: twittex-app:${{ github.event.inputs.ecr_hash }}"
